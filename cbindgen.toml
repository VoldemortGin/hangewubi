language = "C"
include_guard = "HANGEWUBI_H"
pragma_once = false
cpp_compat = true
autogen_warning = "/* 本文件由 cbindgen 从 src/ffi.rs 自动生成，请勿手动编辑。 */\n/* This file is auto-generated by cbindgen from src/ffi.rs. DO NOT EDIT. */"
documentation = true
documentation_style = "c99"
usize_is_size_t = true

[parse]
parse_deps = false

[enum]
rename_variants = "QualifiedScreamingSnakeCase"

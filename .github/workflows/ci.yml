name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # 钉死到 rust-toolchain.toml / versions.toml 声明的 1.94.1（铁律 7）。
      - name: Install Rust 1.94.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --verbose

      - name: Build release
        run: cargo build --release

  # 契约漂移守卫（铁律 6）：重新生成 include/hangewubi.h 并比对已提交版本。
  bindings-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.94.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1

      - name: Check binding freshness
        run: bash scripts/check_bindings.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.94.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: clippy, rustfmt

      - name: Check format
        run: cargo fmt --check

      # 与本地门禁（make check / make core）完全一致。
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

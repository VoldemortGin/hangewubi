[package]
name = "hangewubi"
version = "0.2.3"
edition = "2024"
description = "晗戈五笔 - 高性能五笔输入法引擎"
license = "Apache-2.0"
authors = ["林晗 <gin.linhan@gmail.com>"]

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
encoding_rs = "0.8.44"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "hangewubi-cli"
path = "src/bin/cli.rs"

[build-dependencies]
cbindgen = "=0.29.4"
